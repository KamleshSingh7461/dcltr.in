<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dcltr.in — The Verified Secondary Fragrance Marketplace</title>
    <meta name="description" content="dcltr.in is the premier peer-to-peer marketplace to buy, sell, and declutter authentic pre-loved perfumes, rare partials, vintage batches, and decants with 48-hour escrow protection." />
    
    <!-- Bold Marketplace Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Cinzel:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-[#0A0A0C] font-sans antialiased selection:bg-[#0A0A0C] selection:text-white min-h-screen overflow-x-hidden">
    <div id="root">
      <div id="initial-loader" style="position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
        <div style="position:relative;padding:12px;margin-bottom:24px;">
          <img src="/logo.png" alt="dcltr.in" style="height:60px;width:auto;object-fit:contain;animation:initialPulse 1.2s ease-in-out infinite;" />
        </div>
        <div style="width:180px;height:3px;background:#f3f4f6;border-radius:999px;overflow:hidden;position:relative;">
          <div style="width:100%;height:100%;background:#0a0a0c;border-radius:999px;animation:initialProgress 1.1s cubic-bezier(0.16,1,0.3,1) forwards;"></div>
        </div>
        <style>
          @keyframes initialProgress { 0% { width: 0%; } 40% { width: 65%; } 85% { width: 92%; } 100% { width: 100%; } }
          @keyframes initialPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(0.97); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
